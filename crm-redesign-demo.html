function head(title,desc,actions='',eyebrow='AAIE / WORKSPACE'){return `<div class="page-head"><div><div class="eyebrow">${esc(eyebrow)}</div><h1>${esc(title)}</h1><p>${esc(desc)}</p><div class="demo-note">交互演示 · 不连接真实服务 · 刷新恢复示例</div></div><div class="head-actions">${actions}</div></div>`}
function metric(label,number,foot,ic='users',accent=false){return `<div class="metric ${accent?'accent':''}"><div class="caption">${label}${ico(ic)}</div><span class="number mono">${number}</span><div class="foot">${foot}</div></div>`}
function tasksHTML(full=false){const tasks=DEMO.tasks.filter(t=>state.taskTab==='已完成'?t.done:!t.done&&(state.taskTab==='全部待办'||t.priority===state.taskTab));return `<div class="segmented" role="group" aria-label="待办筛选">${['全部待办','逾期','今日','已完成'].map(t=>`<button class="segment ${state.taskTab===t?'active':''}" data-action="task-tab" data-value="${t}">${t}<span>${DEMO.tasks.filter(x=>t==='已完成'?x.done:!x.done&&(t==='全部待办'||x.priority===t)).length}</span></button>`).join('')}</div>${tasks.length?tasks.map(t=>`<div class="task ${t.done?'done':''}"><button class="check" data-action="task-done" data-id="${t.id}" aria-label="${t.done?'恢复':'完成'}：${esc(t.title)}" ${!writable()?'disabled':''}>${t.done?'✓':''}</button><div class="task-copy"><a href="#${t.href}"><strong>${esc(t.title)}</strong></a><small>${esc(t.student)} <span style="padding:0 5px">·</span> ${esc(t.type)}</small></div><span class="due ${t.priority==='逾期'?'overdue':''}">${esc(t.due)}</span>${full?`<button class="text-btn" data-action="task-delay" data-id="${t.id}" ${!writable()?'disabled':''}>稍后提醒</button>`:''}<a href="#${t.href}" class="text-btn" aria-label="处理 ${esc(t.title)}">${ico('chevron')}</a></div>`).join(''):empty('当前分类暂无待办','查看全部','task-all')}`}
function empty(text,action='',key=''){return `<div class="empty">${ico('folder')}<p>${esc(text)}</p>${action?btn(action,key,'small'):''}</div>`}
function pipeline(){const counts=Object.entries(DEMO.students.reduce((a,s)=>(a[s.stage]=(a[s.stage]||0)+1,a),{}));return `<div class="pipeline">${counts.map(([s,n])=>`<div class="bar-row"><span>${esc(s)}</span><div class="bar-track"><div class="bar-fill" style="width:${n/DEMO.students.length*100}%"></div></div><b>${n}</b></div>`).join('')}</div>`}
function activity(id){const name=studentById(id)?.name;return `<div class="activity">${DEMO.timeline.filter(x=>!id||x.student===id||x.title.includes(name)||x.detail.includes(name)).slice(0,4).map(x=>`<div class="activity-item"><strong>${esc(x.title)}</strong><p>${esc(x.detail)}</p><time>${esc(x.time)}</time></div>`).join('')}</div>`}
function dashboard(){const outstanding=DEMO.tasks.filter(t=>!t.done);return head('每一步，都清晰有序。','今天是 2026 年 11 月 4 日，星期三 · 墨尔本时间',`${btn(ico('link')+' 邀请家长','invite')}${btn(ico('plus')+' 新建学生','new-student','primary')}`,'GOOD MORNING / 工作台')+`<div class="metrics">${metric('在办学生',DEMO.students.filter(s=>s.stage!=='已完成').length+'<small>位</small>',`<b>${DEMO.students.filter(s=>s.stage!=='已完成').length} 个在办</b> ${DEMO.students.filter(s=>s.stage==='已完成').length} 个已完成`,'users',true)}${metric('待处理事项',outstanding.length+'<small>项</small>',`<b>${outstanding.filter(t=>t.priority==='逾期').length} 项逾期</b> 优先处理`,'bell')}${metric('等待家长确认','2<small>项</small>','方案确认与合同签署','link')}${metric('签证补件','1<small>项</small>','下个截止日 06/11/2026','passport')}</div><div class="dashboard-grid"><div class="stack"><section class="card"><div class="card-head"><div><h2>我的待办</h2><p>先处理紧急事项，再推进下一步</p></div><a href="#reminders" class="text-btn">全部提醒 ↗</a></div>${tasksHTML()}</section><section class="card"><div class="card-head"><div><h2>最近办理的学生</h2><p>学生、当前阶段和负责人一目了然</p></div><a href="#students" class="text-btn">查看全部 ↗</a></div>${studentTable(DEMO.students.slice(0,4),true)}</section></div><div class="stack"><section class="card"><div class="card-head"><h2>快捷开始</h2><span class="muted">${ico('plus')}</span></div><div class="quick-grid">${[['student/D2026001/materials','审核材料','file'],['plans','制作方案','edit'],['visa','签证案件','passport'],['contracts','合同管理','pen']].filter(x=>moduleAllowed(x[0].split('/')[0])).map(([r,t,i])=>`<a class="quick" href="#${r}">${ico(i)}${t}</a>`).join('')}</div></section><section class="card"><div class="card-head"><div><h2>申请阶段分布</h2><p>按当前示例学生统计</p></div>${ico('chart')}</div>${pipeline()}</section><section class="card"><div class="card-head"><h2>最近动态</h2>${ico('clock')}</div>${activity()}</section></div></div>`}
function studentTable(rows,compact=false){return `<div class="table-wrap"><table><thead><tr>${compact?'':'<th><input type="checkbox" data-select-all aria-label="选择本页学生" class="table-check"></th>'}<th>学生</th><th>当前阶段</th>${compact?'':'<th>业务类型</th><th>目标学校</th><th>入学期</th>'}<th>负责人</th><th></th></tr></thead><tbody>${rows.map((s,i)=>`<tr>${compact?'':`<td><input type="checkbox" class="table-check" data-select="${s.id}" ${state.selected.has(s.id)?'checked':''} aria-label="选择 ${s.name}"></td>`}<td><a class="student-cell" href="#student/${s.id}/profile"><span class="avatar ${['','sage','blue','rose'][i%4]}">${esc(s.avatar||s.name[0])}</span><span><strong>${esc(s.name)}</strong><small>${esc(s.id)} · ${esc(s.english)}</small></span></a></td><td>${badge(s.stage)}</td>${compact?'':`<td>${esc(s.type)}</td><td class="long-copy">${esc(s.school)}</td><td>${esc(s.intake)}</td>`}<td>${esc(s.owner)}</td><td><a href="#student/${s.id}/profile" class="text-btn" aria-label="查看 ${esc(s.name)}">${ico('chevron')}</a></td></tr>`).join('')||`<tr><td colspan="9">${empty('没有符合筛选条件的学生','清除筛选','clear-filter')}</td></tr>`}</tbody></table></div>`}

function reminders(){return head('提醒中心','按截止时间处理待办；完成或稍后提醒会更新本次演示状态。',btn(ico('plus')+' 新建提醒','new-task','primary'),'REMINDERS / 日常工作')+`<section class="card"><div class="card-head"><h2>待办与跟进</h2><span class="muted">${ico('bell')}</span></div>${tasksHTML(true)}</section>`}
function tabsHTML(module,tabs,active){return `<nav class="tabs" aria-label="${esc(pageTitle(module))}分区">${Object.entries(tabs).map(([k,t])=>`<a class="tab ${k===active?'active':''}" href="#${module}/${k}" ${k===active?'aria-current="page"':''}>${esc(t.title)}</a>`).join('')}</nav>`}

function workspace(key,sub){const page=PAGES[key],tabKey=page.tabs[sub]?sub:Object.keys(page.tabs)[0],t=page.tabs[tabKey];state.route=key+'/'+tabKey;if(key==='system'&&tabKey==='audit'){for(const a of DEMO.audit){if(!t.rows.some(r=>r['操作']===a.title&&r['时间']===a.time))t.rows.unshift({id:'AUD-'+t.rows.length,'操作者':a.who,'操作':a.title,'业务对象':'本次演示','时间':a.time,'状态':'成功'})}}const q=(state.q[state.route]||'').toLowerCase(),filter=state.filter[state.route]||'全部状态';const statusCol=t.columns.find(c=>c==='状态')||t.columns.find(c=>c.includes('状态'));const rows=t.rows.filter(r=>Object.values(r).join(' ').toLowerCase().includes(q)&&(filter==='全部状态'||r[statusCol]===filter));const statuses=[...new Set(t.rows.map(r=>r[statusCol]).filter(Boolean))];let extra='';if(key==='schools'&&tabKey==='map')extra=`<div class="school-visual"><div class="school-pin">Northfield</div><div class="school-pin">Westhaven</div><div class="school-pin">Eastwood</div><span class="muted">学校位置示意 · 不代表真实地理位置</span></div>`;if(key==='reports')extra=`<div class="metrics">${metric('学生总数',DEMO.students.length,'本原型示例数据')}${metric('在办业务',7,'按学生当前阶段统计','folder')}${metric('待办事项',DEMO.tasks.filter(t=>!t.done).length,'本次演示状态','bell')}${metric('学校示例',4,'均为虚构院校','school')}</div><section class="card card-pad" style="margin-bottom:20px"><h2>申请阶段分布</h2><div class="chart-strip">${DEMO.students.map(s=>`<span title="${esc(s.stage)}"></span>`).join('')}</div>${pipeline()}</section>`;return head(page.title,page.desc,`${key==='parent'?link('家长端预览 ↗','portal/form'):''}${btn(ico('download')+' 导出','export-table')}${t.action&&writable()?btn(ico('plus')+' '+t.action,'new-record','primary'):''}`)+tabsHTML(key,page.tabs,tabKey)+extra+`<div class="info-strip">${ico('info')}<span>${esc(t.description)}${key==='revenue'?' 所有金额与佣金规则均为虚构示例。':''}</span></div><section class="card"><div class="toolbar"><label class="search-field">${ico('search')}<input id="table-q" placeholder="搜索${esc(t.title)}…" aria-label="搜索当前列表" value="${esc(state.q[state.route]||'')}"></label><select id="table-filter" aria-label="状态筛选"><option>全部状态</option>${statuses.map(s=>`<option ${s===filter?'selected':''}>${esc(s)}</option>`).join('')}</select><span class="spacer"></span><span class="result-count">${rows.length} 条记录</span>${btn('清除筛选','clear-filter','small')}</div><div class="table-wrap"><table><thead><tr>${t.columns.map(c=>`<th>${esc(c)}</th>`).join('')}<th>操作</th></tr></thead><tbody>${rows.map(r=>`<tr>${t.columns.map((c,i)=>`<td ${i===0?'class="long-copy"':''}>${c==='状态'||c==='当前阶段'?badge(r[c]):i===0?`<strong>${esc(r[c])}</strong>`:esc(r[c])}</td>`).join('')}<td><button class="text-btn" data-action="record-detail" data-id="${r.id}">查看 ${ico('chevron')}</button></td></tr>`).join('')||`<tr><td colspan="${t.columns.length+1}">${empty('暂无符合条件的记录','清除筛选','clear-filter')}</td></tr>`}</tbody></table></div><div class="pagination"><span>${esc(t.title)} · 全部 ${rows.length} 条</span><span>数据仅保留在当前演示中</span></div></section>`}

function syncDocument(d){for(const t of Object.values(PAGES.files.tabs)){for(const r of t.rows){if(r.id===d.id||(r['学生']===studentById(d.student)?.name&&r['文件名称']===d.name)){r['状态']=d.status;if('版本' in r)r['版本']=d.version}}}}

function student(id,sub){const s=studentById(id);if(!s)return head('未找到学生','此编号不在本次演示数据中。',link('返回学生列表','students'));const tab=STUDENT_TABS[sub]?sub:'profile';return `<div class="page-head" style="margin-bottom:17px"><div class="crumb" style="display:flex"><a href="#students">学生管理</a><span>/</span><strong>${esc(s.name)}</strong></div>${link('返回学生列表','students','small')}</div><section class="student-hero"><div class="student-hero-top"><div class="student-identity"><span class="avatar">${esc(s.avatar||s.name[0])}</span><div><div style="display:flex;gap:10px;align-items:center"><h1>${esc(s.name)}</h1>${badge(s.stage)}</div><small>${esc(s.english)} · ${esc(s.id)}</small></div></div><div class="head-actions">${btn('编辑资料','edit-student','',`data-id="${id}" ${!writable()?'disabled':''}`)}${btn(ico('plus')+' 记录跟进','add-note','primary',`data-id="${id}" ${!writable()?'disabled':''}`)}</div></div><div class="student-facts">${[['当前业务',s.type],['申请年级',s.grade],['入学时间',s.intake],['目标城市',s.city],['负责同事',s.owner]].map(([k,v])=>`<div><small>${k}</small><strong>${esc(v)}</strong></div>`).join('')}</div></section><nav class="tabs" aria-label="学生业务分区">${Object.entries(STUDENT_TABS).filter(([k])=>canViewStudentTab(k)).map(([k,t])=>`<a class="tab ${k===tab?'active':''}" href="#student/${id}/${k}" ${k===tab?'aria-current="page"':''}>${t}</a>`).join('')}</nav>${canViewStudentTab(tab)?studentSection(s,tab):denied()}<div class="demo-note">当前学生资料与流程均为虚构示例</div>`}
